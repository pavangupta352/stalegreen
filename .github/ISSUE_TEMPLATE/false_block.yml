name: False block
description: The gate blocked a claim whose evidence was fresh, or the rewrite broke a command.
title: "False block: "
labels: ["false-block"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. False blocks are the bugs this project cares about most. The verdict record usually holds everything needed, so please paste it rather than a transcript.
  - type: textarea
    id: verdict
    attributes:
      label: Verdict record
      description: Output of `stalegreen check --json` for the session, with anything private removed. The relevant part is the last entry under `verdicts`.
      render: json
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Verification command
      description: The command as the agent typed it, for example `pnpm test | tail -5`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Why the evidence was fresh, or what the rewrite changed about the command's behaviour.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `stalegreen doctor` first two lines, plus the harness and its version.
      placeholder: stalegreen 0.1.0, node v22.x, Claude Code 2.1.x
    validations:
      required: true
