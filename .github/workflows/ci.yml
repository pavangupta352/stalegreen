name: ci
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  # The engine is pure logic and must behave the same on Windows; the tests that
  # drive real POSIX shells (rewrite, gate, fingerprint, timing) stay on the
  # Unix matrix above.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/shell.test.ts test/runners.test.ts test/claims.test.ts test/masking.test.ts test/edits.test.ts test/permissions.test.ts test/transcript.test.ts test/codex-transcript.test.ts test/codex-hooks.test.ts test/dsh.test.ts test/stats.test.ts test/redact.test.ts test/plugin.test.ts test/process.test.ts test/cli.test.ts
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the package layout and its types
        run: |
          npx --yes publint
          npx --yes @arethetypeswrong/cli --pack .
      - name: Install the packed tarball into a scratch project and use it both ways
        run: |
          npm pack --silent
          mkdir -p /tmp/scratch && cd /tmp/scratch
          npm init -y >/dev/null
          npm install --silent "$GITHUB_WORKSPACE"/stalegreen-*.tgz
          npx stalegreen --version
          node -e "const s=require('stalegreen'); if(!s.detect('npm test')) throw new Error('cjs detect failed'); console.log('cjs ok', s.VERSION)"
          node --input-type=module -e "import { detect, VERSION } from 'stalegreen'; if(!detect('pytest -q')) throw new Error('esm detect failed'); console.log('esm ok', VERSION)"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A commit that adds hundreds of fixtures makes git print a rename-detection
      # warning on stderr, which gitleaks treats as a scan failure.
      - run: git config --global diff.renameLimit 100000
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
