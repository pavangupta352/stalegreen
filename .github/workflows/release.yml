name: release

# Publishes stalegreen to npm on a version tag through trusted publishing
# (OIDC). No token is stored anywhere.
#
# One-time setup: the first version is published by hand, then on npmjs.com
# under the package's settings a trusted publisher is added with
# owner pavangupta352, repository stalegreen, workflow release.yml,
# environment npm.
#
# Release: bump the version in package.json, plugin/.claude-plugin/plugin.json
# and .claude-plugin/marketplace.json (the test suite checks they agree),
# update CHANGELOG.md, then `git tag vX.Y.Z && git push origin vX.Y.Z`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version
      # setup-node writes a placeholder _authToken line; an invalid token beats OIDC, so remove it.
      - name: Remove the placeholder auth token so OIDC is used
        run: |
          if [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - run: npm ci
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "::error::tag $TAG != version $PKG"; exit 1; }
      # prepublishOnly builds and runs the suite again.
      - name: Publish if this version is new
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "stalegreen@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::stalegreen@$VERSION is already on npm, skipping"
            exit 0
          fi
          npm publish --provenance --access public
      - name: Check the published package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in 1 2 3 4 5 6; do
            if npm view "stalegreen@$VERSION" version >/dev/null 2>&1; then break; fi
            sleep 10
          done
          cd "$(mktemp -d)"
          npx -y "stalegreen@$VERSION" --version

  github-release:
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
